name: Android APK

"on":
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay-test:
    name: Relay testleri
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js 24 kur
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Relay testlerini çalıştır
        working-directory: server
        run: node --test

  android-build:
    name: APK oluştur
    needs: relay-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.11.1 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Android SDK 35'i hazırla
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Lint, birim testi ve APK derlemesi
        run: gradle --no-daemon --no-build-cache --stacktrace clean :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: Teslim dosyalarını hazırla
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/sessiz-oda.apk
          cd dist
          sha256sum sessiz-oda.apk > sessiz-oda.apk.sha256

      - name: APK'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: sessiz-oda-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14
